name: 🎾 CourtSimulator Daily Update

on:
  schedule:
    # 4 actualizaciones al día (cada 6 horas)
    - cron: '0 6,12,18,0 * * *'
  workflow_dispatch:  # Permite ejecución manual

jobs:
  # Job 1: Scraping de partidos
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: pip install -r requirements.txt

      - name: 🎾 Scrape yesterday's results
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          YESTERDAY=$(date -d "yesterday" +%Y-%m-%d)
          echo "Scraping matches for $YESTERDAY"
          python pipeline_run.py scrape $YESTERDAY

      - name: 📅 Scrape today's schedule
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          TODAY=$(date +%Y-%m-%d)
          echo "Scraping scheduled matches for $TODAY"
          python pipeline_run.py scrape $TODAY

      - name: 📤 Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-logs-${{ github.run_number }}
          path: logs/
          retention-days: 7

  # Job 2: Backfill de jugadores (solo en la actualización de las 06:00 UTC)
  backfill:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 6 * * *'
    timeout-minutes: 120
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: pip install -r requirements.txt

      - name: 👤 Backfill player profiles
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python pipeline_run.py backfill --limit 500

  # Job 3: Notificación a Telegram (corre siempre, después del scraping)
  notify:
    runs-on: ubuntu-latest
    needs: scrape
    if: always()
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: pip install -r requirements.txt

      - name: 📱 Send Telegram notification
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          python -c "
          import sys
          sys.path.append('scraper')
          from notifications import send_daily_update
          send_daily_update()
          "