name: Historical Backfill (2021-2026)

on:
  workflow_dispatch:  # Solo se ejecuta manualmente

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 4320  # 72 horas (3 días)
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run historical backfill
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          echo "🚀 Iniciando backfill histórico desde 2021-01-01 hasta 2026-09-09"
          echo "Esto tomará aproximadamente 2-3 días de ejecución continua"
          
          # Ejecuta el pipeline en modo rango (usará el checkpoint para resumir)
          python pipeline_run.py scrape 2021-01-01 2026-09-09
          
          echo "✅ Backfill completado"

      - name: Run player backfill
        if: success()
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          echo "🔄 Enriqueciendo perfiles de jugadores..."
          python pipeline_run.py backfill --limit 5000