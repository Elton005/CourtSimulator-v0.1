name: 🎾 CourtSimulator Daily Update

on:
  schedule:
    # Cada 6 horas: 00:00, 06:00, 12:00, 18:00 UTC
    - cron: '0 */6 * * *'
  workflow_dispatch:  # Permite ejecución manual

jobs:
  # Job 1: Scraping de resultados finalizados (ayer)
  scrape-results:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: pip install -r requirements.txt

      - name: 🎾 Scrape yesterday's results
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          YESTERDAY=$(date -d "yesterday" +%Y-%m-%d)
          echo "📊 Scraping resultados finalizados para $YESTERDAY"
          python pipeline_run.py scrape $YESTERDAY

      - name: 📤 Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-results-logs-${{ github.run_number }}
          path: logs/
          retention-days: 7

  scrape-upcoming:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: pip install -r requirements.txt

      - name: 📅 Scrape upcoming matches (today + tomorrow)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          echo "📅 Scraping partidos programados para hoy + mañana"
          python pipeline_run.py upcoming --days-ahead 1

      - name: 📤 Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-upcoming-logs-${{ github.run_number }}
          path: logs/
          retention-days: 7

  # Job 3: Backfill de jugadores (solo a las 06:00 UTC o ejecución manual)
  backfill:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 6 * * *' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 120
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: pip install -r requirements.txt

      - name: 👤 Backfill player profiles
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          echo "👤 Enriqueciendo perfiles de jugadores (límite: 500)"
          python pipeline_run.py backfill --limit 500

      - name: 📤 Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backfill-logs-${{ github.run_number }}
          path: logs/
          retention-days: 7

  # Job 4: Notificación a Telegram (después de scraping)
  notify:
    runs-on: ubuntu-latest
    needs: [scrape-results, scrape-upcoming]
    if: always()
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: pip install -r requirements.txt

      - name: 📱 Send Telegram notification
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          echo "🔍 Verificando que las variables de entorno existan..."
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "❌ ERROR: SUPABASE_DB_URL no está configurada en los Secrets de GitHub."
            exit 1
          fi
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHANNEL_ID" ]; then
            echo "❌ ERROR: Faltan credenciales de Telegram en los Secrets de GitHub."
            exit 1
          fi
          echo "✅ Variables verificadas. Enviando notificación..."
          python scraper/notifications.py