name: Historical Backfill (Resumable)

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Fecha de inicio (YYYY-MM-DD)'
        required: true
        default: '2021-03-14'
      end_date:
        description: 'Fecha de fin (YYYY-MM-DD)'
        required: true
        default: '2025-12-31'

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 6 horas (límite máximo de GitHub Actions gratis)
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 🔑 PASO CLAVE 1: Descargar el checkpoint de la ejecución ANTERIOR
      - name: Download previous checkpoint (if exists)
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: ${{ github.workflow }} # Busca en este mismo workflow
          name: checkpoint-artifact
          path: .
          if_no_artifact_found: warn # No falla si es la primera vez que se ejecuta
        continue-on-error: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run historical backfill
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          echo "🚀 Iniciando backfill desde ${{ github.event.inputs.start_date }} hasta ${{ github.event.inputs.end_date }}"
          echo "📂 Archivos en el directorio actual:"
          ls -la # Esto te permitirá ver en los logs si se descargó el checkpoint.json
          
          # El script de Python leerá automáticamente el backfill_checkpoint.json si existe
          python pipeline_run.py scrape ${{ github.event.inputs.start_date }} ${{ github.event.inputs.end_date }}

      # 🔑 PASO CLAVE 2: Guardar el checkpoint SIEMPRE (incluso si hay timeout o error)
      - name: Save checkpoint for next run
        if: always() # Se ejecuta aunque el paso anterior falle o se agote el tiempo
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-artifact
          path: backfill_checkpoint.json
          retention-days: 7
          overwrite: true
