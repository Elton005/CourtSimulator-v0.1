name: 🔄 Backfill Jugadores (Perfiles)

on:
  schedule:
    # Ejecutar automáticamente todos los domingos a las 04:00 AM UTC
    - cron: '0 4 * * 0'
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Tamaño del lote de jugadores a procesar (ej: 500)'
        required: false
        default: '500'
        type: string

jobs:
  backfill-players:
    runs-on: ubuntu-latest
    timeout-minutes: 180 # 3 horas máximo de ejecución (suficiente para ~1000-1500 jugadores)
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔄 Ejecutar backfill de perfiles
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          echo "🚀 Iniciando backfill masivo de perfiles de jugadores..."
          BATCH_SIZE=${{ github.event.inputs.batch_size || '500' }}
          echo "📦 Tamaño del lote configurado: $BATCH_SIZE"
          echo "⏳ Esto puede tomar un tiempo dependiendo de la cantidad de jugadores pendientes..."
          echo ""
          
          # Ejecutamos el script con la bandera --all para procesar TODOS los pendientes
          python backfill_players.py --all --batch-size $BATCH_SIZE
          
          echo ""
          echo "✅ Proceso de backfill finalizado."